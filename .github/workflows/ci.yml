name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 'Instalar dependencias'
        run: python -m pip install --upgrade pip && pip install -e ".[dev,web]"

      - name: 'Lint (ruff)'
        run: ruff check agentsec app tests

      - name: 'Formato (ruff format --check)'
        run: ruff format --check agentsec app tests

      - name: 'Tipos (mypy)'
        run: mypy agentsec app

      - name: 'Tests (pytest)'
        run: pytest tests -q
